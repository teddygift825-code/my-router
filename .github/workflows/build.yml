name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install pyinstaller

      - name: Generate icon
        run: python make_icon.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name DualRouterDashboard
          --icon app_icon.ico
          dual_router_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualRouterDashboard-windows
          path: dist/DualRouterDashboard.exe
          if-no-files-found: error

      - name: Publish release (on version tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Dual-Router Dashboard ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/DualRouterDashboard.exe
          make_latest: true
          body: |
            🌐 **Dual-Router Dashboard ${{ github.ref_name }}**

            A colourful Windows desktop app for monitoring a dual-router
            (WISP) network — live device tables for the indoor LAN and the
            WAN leg between the routers, plus:

            - ⚡ built-in speed test (download / upload / latency / jitter)
            - 📡 ping monitor, 🗺 traceroute viewer, 🔌 TCP port scanner
            - 📶 access control — set how many devices may use the internet,
              register devices manually by LAN IP or MAC
            - 🌈 5 vivid themes (Sunset, Ocean, Neon, Candy, Forest — no black)
            - 🔔 sound + toast alerts, 📊 live latency graph, 📤 CSV/JSON export

            ### Install
            1. Download **DualRouterDashboard.exe** below
            2. Double-click it — no Python or installation needed
            3. Optional: run `install_shortcut.ps1` to add a Desktop/Start
               Menu shortcut

            > Windows SmartScreen may note the build is unsigned — choose
            > *More info ▸ Run anyway*.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
